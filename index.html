<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <script>
    const cake = document.querySelector("#cakeAR");
    cake.setAttribute("visible", false);
    </script>
  </head>

  <body>
    <a-scene mindar-image="imageTargetSrc: ./public/targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="mickeyWave" src="./public/mickey-wave.glb"></a-asset-item>
        <a-asset-item id="curtissFly" src="./public/curtiss.glb"></a-asset-item>
        <a-asset-item id="chocoCake" src="./public/dbc-cake.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"> </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="90 90 90" position="0 0 0.5" scale="0.05 0.05 0.05" src="#mickeyWave" animation-mixer="timeScale.1">
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model rotation="90 90 90" position="0 0 1" scale="0.04 0.04 0.04" src="#curtissFly" animation-mixer="timeScale.1">
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model class="clickable" id="cakeAR" visible=true rotation="90 90 90" position="0 0 0.1" scale="0.5 0.5 0.5" src="#chocoCake" animation-mixer="timeScale.1">
      </a-entity>
    </a-scene>

  </body>
</html>
