<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {

        const sceneEl = document.querySelector("#scene");
        let arSystem;
        sceneEl.addEventListener('loaded', function () {          
          arSystem = sceneEl.systems["mindar-image-system"];
          arSystem.start();
          const cake = document.querySelector("#cakeAR")
          const ball = document.querySelector("#confettiBall")
          cake.addEventListener('click', (event) => {cake.setAttribute("visible", false)})
          ball.addEventListener('click', (event) => {ball.setAttribute("visible", false)})
        })
      });
    </script>
  </head>

  <body>
    <a-scene id="scene" mindar-image="imageTargetSrc: ./public/targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="mickeyWave" src="./public/mickey-wave.glb"></a-asset-item>
        <a-asset-item id="curtissFly" src="./public/curtiss.glb"></a-asset-item>
        <a-asset-item id="chocoCake" src="./public/dbc-cake.glb"></a-asset-item>
        <a-asset-item id="cBall" src="./public/confetti-ball.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"> </a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="90 90 90" position="0 0 0.5" scale="0.05 0.05 0.05" src="#mickeyWave" animation-mixer="timeScale.1">
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model rotation="90 90 90" position="0 0 1" scale="0.04 0.04 0.04" src="#curtissFly" animation-mixer="timeScale.1">
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2" class="clickable" id="cakeAR" visible=true>
        <a-gltf-model rotation="90 90 90" position="0 0 0.1" scale="0.5 0.5 0.5" src="#chocoCake" animation-mixer="timeScale.1">
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 3" class="clickable" id="confettiBall" visible=true animation-mixer="timeScale: 1; clip: shake">
        <a-gltf-model rotation="0 90 90" position="0 0 0.1" scale="0.2 0.2 0.2" src="#cBall">
      </a-entity>
    </a-scene>

  </body>
</html>
